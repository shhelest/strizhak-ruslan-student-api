services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: strizhak-ruslan-student-api:v1.0-37187
    container_name: strizhak-ruslan-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: student
    depends_on:
      db:
        condition: service_healthy
    networks:
      - strizhak-ruslan-network

  db:
    image: postgres:16
    container_name: strizhak-ruslan-db
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    volumes:
      - strizhak-ruslan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d studentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strizhak-ruslan-network

volumes:
  strizhak-ruslan-postgres-data:

networks:
  strizhak-ruslan-network:
    driver: bridge